services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - db_data:/var/opt/mssql
    networks:
      - red_tienda

  api:
    build: .
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "${API_PORT}:8080"
    depends_on:
      - db
    networks:
      - red_tienda

volumes:
  db_data:

networks:
  red_tienda:
    driver: bridge
